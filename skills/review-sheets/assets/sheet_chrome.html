<!-- sheet_chrome.html — the three things a review sheet must get right about its own chrome.
     Copy this into your generated page and wire the three marked hooks. It is deliberately
     dependency-free and ~100 lines, because a sheet is opened from disk, often offline.

     These exist because a human sat in front of a sheet that had none of them and could not
     work. Each one is a specific complaint, not a preference:

       1. "the top instructions are persistent and block the screen"
       2. "it MUST have the file to link to already present and easily copied (button press)"
       3. "I really like when the different blocks have a persistent name that follows
           along with you while you scroll"
-->
<style>
/* ── 1. THE BRIEF FOLDS. ───────────────────────────────────────────────────────────
   A review sheet's header is sticky, because the filters must stay reachable. That makes
   an always-open brief a permanent hole in the screen — on a 600-row list the human scrolls
   past it hundreds of times. Fold it, and REMEMBER the fold: re-collapsing on every visit
   is the same annoyance wearing a different hat. */
header{position:sticky;top:0;z-index:20;background:#14161a;border-bottom:1px solid #2a2f37}
.hrow{display:flex;align-items:center;gap:12px;padding:10px 22px}
#fold{margin-left:auto;cursor:pointer;background:#0f1216;border:1px solid #2a2f37;color:#e8e6e3;border-radius:5px;padding:5px 12px;font:inherit}
body.folded #brief{display:none}

/* ── 2. THE PATH IS PRESENT AND COPYABLE. ──────────────────────────────────────────
   showSaveFilePicker() accepts a FILENAME and not a folder — a browser rule you cannot
   code around — so the human has to put the file in the right place themselves. A path
   they must retype is a path they will get wrong, and a decisions file written to the
   wrong folder is invisible: the sheet says "saved", and the generator finds nothing. */
.pathbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#0f1216;
         border:1px solid #2a2f37;border-radius:5px;padding:9px 12px;margin:8px 0;font-size:12px}
.pathbar code{color:#cfe3ff;font-family:ui-monospace,monospace}
.pathbar button{cursor:pointer;background:#1d2733;border:1px solid #2f4358;color:#cfe3ff;border-radius:4px;padding:4px 10px;font:inherit}

/* ── 3. THE GROUP NAME FOLLOWS. ────────────────────────────────────────────────────
   Scroll into a long list and the question is always "what am I looking at now?". A sticky
   group label answers it continuously, and it is what makes bulk judgement possible: whole
   groups share a character and get decided in one motion.
   ⚠️ `top` MUST be set from the measured header height, not hardcoded — the header changes
   height when the brief folds, and a stale offset leaves the label floating or buried. */
.gh{position:sticky;z-index:10;background:#10141a;border-top:1px solid #2a2f37;
    border-bottom:1px solid #2a2f37;padding:6px 22px;font-size:12px;font-weight:600;color:#ffb454}
.gh.nostick{position:static}   /* groups of <=3: a sticky label can cover the only row in one */
</style>

<header>
  <div class="hrow">
    <h1>TITLE</h1>
    <span class="sub">COUNTS</span>
    <button id="fold">▾ brief</button>
  </div>
  <div id="brief">
    <!-- panels: the brief, the posture, and any rule YOU invented -->
    <div class="pathbar">
      <b>Save decisions to</b>
      <code id="p1">C:\full\native\path\to\decisions.json</code>
      <button data-copy="p1">copy path</button>
      <span>the picker cannot be given a folder — copy this into its filename box</span>
    </div>
  </div>
  <div class="bar"><!-- filters live OUTSIDE #brief so they survive folding --></div>
</header>

<script>
const el = id => document.getElementById(id);

// ── 1. fold, and remember
const FOLDKEY = 'sheet_folded';
function setFold(f){
  document.body.classList.toggle('folded', f);
  el('fold').textContent = f ? '▸ brief' : '▾ brief';
  try { localStorage.setItem(FOLDKEY, f ? '1' : ''); } catch(e) {}
  measure();                                   // the header just changed height
}
el('fold').onclick = () => setFold(!document.body.classList.contains('folded'));
try { setFold(localStorage.getItem(FOLDKEY) === '1'); } catch(e) { setFold(false); }

// ── 2. copy the path, with a fallback that still works when the clipboard API is refused
//      (file:// pages in some browsers) — selecting the text is worse than copying, and far
//      better than leaving the human to transcribe a path by eye.
for (const b of document.querySelectorAll('[data-copy]')) b.onclick = async () => {
  const node = el(b.dataset.copy);
  try {
    await navigator.clipboard.writeText(node.textContent);
    const t = b.textContent; b.textContent = 'copied ✓'; setTimeout(() => b.textContent = t, 1200);
  } catch(e) {
    const r = document.createRange(); r.selectNode(node);
    getSelection().removeAllRanges(); getSelection().addRange(r);
    b.textContent = 'press ⌘/Ctrl+C';
  }
};

// ── 3. keep every sticky group label pinned directly under the header, whatever its height
function measure(){
  const h = document.querySelector('header').offsetHeight;
  for (const g of document.querySelectorAll('.gh')) g.style.top = h + 'px';
}
addEventListener('resize', measure);
// call measure() again at the END of every render(), because new .gh nodes have no top yet
</script>
