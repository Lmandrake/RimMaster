<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ash'karr orthographic globes vs reference photographs</title>
<style>
  html, body { margin: 0; padding: 0; }
  body {
    background: #14161a;
    color: #d8dce2;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 28px 32px 60px;
  }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; color: #f0f2f5; }
  .caption { font-size: 13px; color: #9aa3ad; margin: 0 0 28px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
       color: #7f8892; margin: 34px 0 14px; border-bottom: 1px solid #262a30; padding-bottom: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 26px; }
  figure { margin: 0; width: 520px; }
  figure img { width: 520px; height: auto; display: block; background: #0b0c0e; border: 1px solid #262a30; }
  figcaption { font-size: 13px; color: #b7bec6; margin-top: 8px; }
  figcaption .sub { display: block; font-size: 11px; color: #737c86; margin-top: 3px; font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<h1>Ash'karr as orthographic globes, beside the reference photographs</h1>
<p class="caption">First globe renders of the Ash'karr world map, at three centres, shown at identical width next to the two binding reference images. 2026-08-20.</p>

<h2>Our renders &mdash; world/view</h2>
<div class="row">
  <figure>
    <img src="world/view/ASHKARR_WORLDMAP.biome.ortho.c0-0.png" alt="Ash'karr ortho, centre 0,0">
    <figcaption>Ours &mdash; centre 0&deg; lat, 0&deg; lon
      <span class="sub">world/view/ASHKARR_WORLDMAP.biome.ortho.c0-0.png</span></figcaption>
  </figure>
  <figure>
    <img src="world/view/ASHKARR_WORLDMAP.biome.ortho.c0-90.png" alt="Ash'karr ortho, centre 0,90">
    <figcaption>Ours &mdash; centre 0&deg; lat, 90&deg; lon (terminator)
      <span class="sub">world/view/ASHKARR_WORLDMAP.biome.ortho.c0-90.png</span></figcaption>
  </figure>
  <figure>
    <img src="world/view/ASHKARR_WORLDMAP.biome.ortho.c0-180.png" alt="Ash'karr ortho, centre 0,180">
    <figcaption>Ours &mdash; centre 0&deg; lat, 180&deg; lon (night cap)
      <span class="sub">world/view/ASHKARR_WORLDMAP.biome.ortho.c0-180.png</span></figcaption>
  </figure>
</div>

<h2>Reference photographs &mdash; research/Jawa</h2>
<div class="row">
  <figure>
    <img src="research/Jawa/planet_map_tidal_lock_inspiration.webp" alt="Reference 1">
    <figcaption>Reference 1 &mdash; tidal-lock planet map
      <span class="sub">research/Jawa/planet_map_tidal_lock_inspiration.webp</span></figcaption>
  </figure>
  <figure>
    <img src="research/Jawa/planet_inspiration_tidal_lock2.webp" alt="Reference 2">
    <figcaption>Reference 2 &mdash; tidal-lock planet, second view
      <span class="sub">research/Jawa/planet_inspiration_tidal_lock2.webp</span></figcaption>
  </figure>
</div>
</body>
</html>
