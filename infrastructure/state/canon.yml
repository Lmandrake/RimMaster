# canon.yml — ONE authoritative value per contested number.
#
# WHY THIS FILE EXISTS
# ===================
# A 2026-08-20 audit of the 119-document design tier found 21 numbers asserted at
# two or more different values, in files that all read as current. Water was 25%,
# 22–28%, 8.6%, 8.1% and 6.9%. Factions were 14, 13, 12 and 11. Nothing was wrong
# by its own lights; every document was written by someone who had measured
# something. What was missing was a place for the answer to LIVE, so the next
# reader got whichever file they opened first.
#
# THE RULE — and it is not "the newest wins"
# =========================================
#   1. A MEASUREMENT of the painted world beats any prose about the painted world.
#   2. An OWNER RULING beats a measurement of something we then changed.
#   3. Where those two conflict, the ruling wins and the measurement is recorded
#      beside it as the realisation — see `temp_curve_c`, where the ruled +14 °C at
#      the terminator and the painted median +13.0 °C are BOTH true and differ only
#      by the altitude lapse.
#   4. Every value below carries `src:` naming where it came from. A value with no
#      source does not belong in this file. ⛔ Do not add one you cannot trace.
#
# ⚠️ `superseded:` IS NOT DECORATION. It is what stops a dead number coming back:
# a reader who finds 25% in a design doc can look here, see it listed as superseded
# with the reason, and know which way the correction runs. Never delete an entry
# from a superseded list.
#
# 🔴 THIS FILE DOES NOT DECIDE SCOPE. Where the audit found a genuine open
# question — not a stale copy, an actual unmade decision — it is filed under
# `needs_ruling:` at the bottom with the evidence, and canon carries NO value for
# it. BUILD measured; the owner rules.
#
# ⚠️ DEPENDENCY, stated plainly because the repo is otherwise stdlib-only: reading this
# file needs PyYAML (6.0.3 is installed on this machine, 2026-08-20). It is the only
# non-stdlib import in the tooling. If that becomes a problem the answer is to convert
# this file to JSON, NOT to hand-roll a YAML parser — the comments above are half the
# value here and a partial parser that silently drops them is worse than either format.
#
# Consumed by `src/RimMandrake/Utils/check_canon.py`, which fails with file:line on
# any design doc asserting a contradicting value. A line is exempt if it documents
# the old number rather than claiming it — see that tool for the exemption rule and
# the `<!-- canon-ok: reason -->` escape.

version: 1
as_of: 2026-08-20
authored_by: BUILD
covers: design/**/*.md

