      to adopt it." ⇒ Ash'karr AS IT STANDS is the v1 planet, and authoring on it is OPEN —
      continuity repairs, landmarks, named places, settlements and terrain detail, edited
      DIRECTLY and in place. The freeze lasted one evening and did its job: it stopped a
      redraft nobody wanted.
      ⛔ What did NOT come back: regenerating the bundle with `ashkarr_paint.py`; and worldgen,
      which is out of every version and always was.
      🔴 `refmatch.py` IS V2 — owner's ruling, 2026-08-22: "Please put refmatch.py in v2
      officially, right now." ⛔ It is NOT cancelled and NOT dead; it is deferred, and this
      ruling used to say "stays cancelled and does not exist". ✅ Do not build it for v1 and
      do not treat a v1 decision as needing it. `design/V2_DREAMS.md > REFERENCE_MATCH_HARNESS_2`
      carries it; the item is `REFMATCH_CANCELLED_NOT_GATED_1`, target v2. `design/V2_DREAMS.md > PLANET_METHOD_RETHINK_1` stands as history, not a plan.
      See `WORLD_ADOPTED_AUTHORING_OPEN_1`, which supersedes `WORLD_FROZEN_RETHINK_PLANET_1`.

  VANILLA_FIREARM_LINE_CUT_1:
    question: "Does the vanilla firearm line stay cut, or come back as the low-tech floor?"
    ruled_by: owner
    ruled_on: 2026-08-22
    ruling: >
      ⛔ IT STAYS CUT. Owner, verbatim: "I like the vanilla weapons being gone, to amplify
      the Star Wars flavor." The eight vanilla INDUSTRIAL guns — revolver, autopistol,
      bolt-action, pump shotgun, machine pistol, heavy SMG, assault rifle, sniper — remain on
      the Cherry Picker list. THEME beat balance and the anti-scarcity cost was accepted
      knowingly.
      ⇒ v1's weapons floor is vanilla NEOLITHIC plus Outer Rim's cheap end — bows and clubs,
      not revolvers. The pools stay full via the retag architecture in
      `WeaponTags_Renormalise.xml` (156 PatchOperations, 465 xpath targets), which grants the
      vanilla tag vocabulary to surviving blasters at the WEAPON end.
      ⚠️ ONE SLICE IS REVERSED AND ONLY ONE: the Mech weapons (`MECH_WEAPONS_UNCUT_1`,
      "we should not be turning off Mech weaponry"). ⛔ Do not read that narrow reversal as
      a broad one.
    superseded:
      - "design/RimMandrake/Custom_World.md:110 — a 2026-08-03 audit recommending AGAINST
         amputation, 'keep vanilla for the low end'. Sound reasoning, overruled on theme."
      - "design/Jawa/mods/required_mods.md:730 — 'v1's floor is vanilla low-tech', 2026-08-15.
         Ambiguous between neolithic and industrial; it meant neolithic."

  SAVANNA_PREMISE_RESOLVE_1:
    question: "Were the Pyrelands meant to be patched vanilla savanna?"
    ruled_by: owner
    ruled_on: 2026-08-20
    ruling: >
      ✅ NO — and the premise was wrong. "We kept Stormy Savanna, so we don't need
      normal Savannah. ZBiome_Grasslands is actually the Stormy Savanah (it has a
      stupid defname)." The cut of vanilla `Savanna` and `Grasslands` STANDS;
      `ZBiome_Grasslands` is the Stormy Savanna and is the Pyrelands carrier, on 233
      painted tiles. Nothing needed reversing. See planet.misleading_defnames.
  DOSSIER_WITHOUT_CAST_ROSTER_1:
    question: >
      The Deepwater Compact has a dossier and a faith and NO cast roster. Deliberate,
      or an omission?
    answered_which: "the Deepwater Compact"
    evidence: >
      ✅ Identified 2026-08-20, not inferred. INHABITED_DESIGN.md §5.9 tabulates twelve
      factions; design/Jawa/bridge/ holds eleven INHABITED_CAST_*.md files, self-numbered
      cast 01–11 — Hutt, Geonosian, Jawa, Droids, Junkers, Blackstar, Wildsteam, Helix,
      Homestead, Tusken, Empire. Deepwater is the only row with no numbered file.
      (INHABITED_CAST_HOMESTEAD.md:15's "the hardest brief of the twelve" counts briefs,
      not files, and is correct.)
    at_stake: >
      One of the five factions holding settlements ships with no named inhabitants.
      ⚠️ It is not a marginal faction: its faith is `the Balance` — "the seas, measured
      and rationed… people for whom excess is the sin" — which is the water politics of
      a desert planet, and the one every other faction's water doctrine reacts to.
    ruled_by: owner
    ruled_on: 2026-08-20
    ruling: >
      ✅ AUTHOR THE MISSING ROSTER, to parity with the other eleven. This is no longer a
      question and is filed as work for DECIDE — DEEPWATER_CAST_ROSTER_1.

# ===========================================================================
# THE CUT LIST vs THE PAINTED MAP — the diff, run once, and it is CLOSED
# ---------------------------------------------------------------------------
# Two biomes were cut on paper and painted onto the map anyway, and both surfaced
# by hand on the same day. Rather than wait for a third, the WHOLE cut list was
# diffed against the painted biome census on 2026-08-20.
#
# ✅ THERE IS NO THIRD CASE. Of the 24 biomes painted on Ash'karr, exactly two were
# ever cut-flagged — `AB_GelatinousSuperorganism` (96 tiles) and `ZBiome_Grasslands`
# (233). The only other hits are the "`Lake` cut, `Ocean` kept" line, which is about
# Lake and names Ocean only as the survivor.
#
# 🔑 THE OWNER RULED THE PAINTER WINS, 2026-08-20: both cuts are REVERSED and the
# tiles stay as painted. So the palette needs telling, once, for both — and the
# reconciliation itself is now done rather than pending.
# ⛔ Do not re-open either as "the cut list says otherwise". The cut list is the loser.
# ===========================================================================
cut_vs_painted:
  reconciled_on: 2026-08-20
  method: >
    Every biome painted on at least one tile of world/ASHKARR_WORLDMAP_tiles.csv, matched
    against every REMOVE/CUT/⛔ line in cherrypick_inbox.md, biome_review_comments.md,
    cherrypick_resolved.md and cherry_picker_killlist.md.
  third_case_exists: false
  reversed:
    - {biome: AB_GelatinousSuperorganism, tiles: 96, pct: 0.44,
       was: "cut 2026-08-04", now: "KEPT as painted, owner 2026-08-20"}
    - {biome: ZBiome_Grasslands, tiles: 233, pct: 1.07,
       was: "REMOVE 2026-08-14", now: "KEPT as painted, owner 2026-08-20",
       note: "carries the Pyrelands' stormy-savanna character; a repaint would have changed a named region"}

# ===========================================================================
# THE GALACTIC EMPIRE — three contested values, settled 2026-08-21 by DECIDE
# ---------------------------------------------------------------------------
# The vessel is vanilla `Empire` (Royalty). The audit is
# design/Jawa/worldbuilding/EMPIRE_GAP_AUDIT.md. These three were each asserted
# two different ways across the design tier; each is settled against a file that
# actually ships, not against whichever number appeared more often.
# ===========================================================================
empire:
  vessel: Empire
  vessel_src: >
    Owner, 2026-08-20: "OuterRim_GalacticEmpire is no longer in the game, we patch
    Empire." src/Jawa/Jawa_Patches/Patches/GalacticEmpire.xml patches
    FactionDef[defName="Empire"] and nothing else.
  tech_level: Ultra
  tech_level_src: >
    Read from the shipped def, 2026-08-21:
    Data/Royalty/Defs/FactionDefs/Faction_Empire.xml — <techLevel>Ultra</techLevel>.
    ⭐ Nothing in src/ patches the field, so Ultra is not merely specced, it is what
    loads. FACTION_SPEC.md:124 agrees and says "do not change".
  tech_level_superseded:
    - value: Spacer
      why: >
        Asserted at faction_roster_v2.md:688 and in faction_world_spec.md's table.
        It mis-reads the vessel — the def has always said Ultra — and no patch was
        ever written to make it true. Design-tier prose, never a build instruction.
  color_spectrum: "the vessel's own — (0.85, 0.85, 0.75), unpatched"
  color_spectrum_src: >
    FACTION_SPEC.md:511 rule R22: reskins keep the vessel's colorSpectrum. The shipped
    patch obeys it — GalacticEmpire.xml touches no colour field. ⭐ Ruled to STAND: the
    vessel's off-white already reads as Imperial, and R22 is the general rule for every
    reskin, so exempting one faction costs consistency to buy nothing visible.
  color_spectrum_superseded:
    - value: "Imperial grey/black"
      why: >
        faction_stage3_buildable_spec.md:294 requires it. It contradicts R22, was never
        built, and the world-map difference between (0.85,0.85,0.75) and grey is not one
        a player can see on a settlement dot.
  xenotype_mix: "Baseliner 0.769 · RimMandrakeChadraFan 0.077 · RimMandrakeChiss 0.077 · RimMandrakeEchani 0.077"
  xenotype_mix_src: >
    src/Jawa/Jawa_Patches/Patches/VanillaFaction_Xenotypes.xml, whose own header records
    it as GENERATED by src/RimMandrake/Utils/apply_race_factions.py "from the owner's
    race/faction matrix". 🔑 The owner's matrix is the source; it ships; it wins.
  xenotype_mix_superseded:
    - value: "Baseliner 0.411 · Echani 0.411 · Chiss 0.137 · ChadraFan 0.041"
      why: >
        🔴 CORRECTED BY THE OWNER, 2026-08-21, one day after it was recorded as settled.
        Echani at `A` gave 41% of the Galactic Empire's pawns and canon stormtroopers are
        human, so Echani `A`→`R` and Chiss `S`→`R` in the matrix's Empire column. ⚠️ The
        line here previously read "the 41% Echani share is the owner's own call" — DECIDE
        wrote that citing him, and he has since revised it. **The mechanism is unchanged:
        the matrix is still the source and still wins; one of its cells was wrong.**
    - value: "baseliner 78 / Chiss 7 / Umbaran 6 / Arkanian 4 / Zabrak 3 / Savant 2"
      why: >
        faction_roster_v2.md:711. Authored before the matrix existed and overtaken by it.
        ⭐ Worth noting rather than deleting: the corrected matrix puts Baseliner at
        **76.9%**, which converges on this figure's 78% from a completely different
        direction. It is still not canon — the matrix is — but it was not wrong about the
        shape.
  leader_kind: Jawa_Empire_Leader
  leader_kind_src: >
    🔴 SPECCED, NOT YET SHIPPED — 2026-08-21. faction_world_spec.md:115 makes the leader
    Emperor Palpatine and src/Jawa/Jawa_Patches/Defs/PawnKindDefs/JawaFactionRoster.xml:92
    authors `Jawa_Empire_Leader` with that label, but `grep -rn fixedLeaderKinds src/`
    returns EMPTY, so the def still ships Royalty's `Empire_Royal_Stellarch`.
    EMPIRE_GAP_AUDIT.md §4 gap 4. ⚠️ This one bakes: the leader pawn is generated at
    world creation.
